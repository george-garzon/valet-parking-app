services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: porter-valet:local
    restart: unless-stopped
    init: true
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # Override any host-specific VALET_STORAGE path from .env.local.
      VALET_STORAGE: /app/storage
    ports:
      - "127.0.0.1:${PORTER_HTTP_PORT:-3000}:3000"
    volumes:
      - valet-storage:/app/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/auth').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s

volumes:
  valet-storage:
